name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s web/tests -v
      - run: |
          node --check web/static/app.js
          node --check web/static/pdf-reader.mjs
          node --check web/static/upload.js
      - run: python -m unittest discover -s tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shizhi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image with a read-only filesystem
        run: |
          docker run -d --name shizhi-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8765:8765 shizhi:ci
          trap 'docker logs shizhi-ci; docker rm -f shizhi-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/healthz
          curl --fail http://127.0.0.1:8765/api/videos | python -c 'import json,sys; assert json.load(sys.stdin) == []'
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
