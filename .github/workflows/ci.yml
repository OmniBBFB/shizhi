name: Shizhi CI and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shizhi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m unittest discover -s web/tests -v
      - run: |
          node --check web/static/app.js
          node --check web/static/pdf-reader.mjs
          node --check web/static/upload.js
      - run: python -m unittest discover -s tests -v
      - name: Validate Compose with an isolated empty env file
        run: python tools/check-compose.py
  pdf-fonts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/shizhi-browser" --ignore-scripts puppeteer-core@25.16.0
      - name: Check embedded fonts without native Math.sumPrecise
        env:
          PDF_TEST_NO_SANDBOX: '1'
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          export PUPPETEER_MODULE="$RUNNER_TEMP/shizhi-browser/node_modules/puppeteer-core"
          node web/tests/pdf-reader-fonts.browser.mjs
  image:
    needs: [test, pdf-fonts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      image_id: ${{ steps.publish.outputs.image_id }}
      archive_sha256: ${{ steps.publish.outputs.archive_sha256 }}
      archive_bytes: ${{ steps.publish.outputs.archive_bytes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag shizhi:ci .
      - name: Test image reading and protected upload on temporary data
        run: python3 tools/check-image.py shizhi:ci
      - name: Publish the verified image
        id: publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/omnibbfb/shizhi:sha-${GITHUB_SHA}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag shizhi:ci "$image"
          docker push "$image"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag shizhi:ci "ghcr.io/omnibbfb/shizhi:${GITHUB_REF_NAME}"
            docker push "ghcr.io/omnibbfb/shizhi:${GITHUB_REF_NAME}"
          fi
          digest=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk '/^ghcr.io\/omnibbfb\/shizhi@sha256:/{print; exit}')
          test -n "$digest"
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published verified image `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          image_id=$(docker image inspect shizhi:ci --format '{{.Id}}')
          docker image save "$image_id" | gzip -1 > "$RUNNER_TEMP/shizhi-image.tar.gz"
          # Docker's containerd store may report an index ID. The server's
          # classic image store uses the actual image config SHA-256.
          image_id=$(python3 -c 'import tarfile,json,hashlib,os; t=tarfile.open(os.environ["RUNNER_TEMP"]+"/shizhi-image.tar.gz"); m=json.load(t.extractfile("manifest.json")); assert len(m)==1 and not m[0].get("RepoTags"); print("sha256:"+hashlib.sha256(t.extractfile(m[0]["Config"]).read()).hexdigest())')
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/shizhi-image.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'archive_bytes=%s\n' "$(stat -c %s "$RUNNER_TEMP/shizhi-image.tar.gz")" >> "$GITHUB_OUTPUT"
      - name: Keep the exact tested image for deployment
        if: steps.publish.outputs.image != ''
        uses: actions/upload-artifact@v7
        with:
          name: shizhi-image
          path: ${{ runner.temp }}/shizhi-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && needs.image.outputs.image != '' && vars.SHIZHI_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shizhi-image
          path: ${{ runner.temp }}/shizhi-image
      - name: Deploy only the existing Shizhi service
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SHIZHI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SHIZHI_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.SHIZHI_DEPLOY_HOST }}
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_ID: ${{ needs.image.outputs.image_id }}
          ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
          ARCHIVE_BYTES: ${{ needs.image.outputs.archive_bytes }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/shizhi-image/shizhi-image.tar.gz
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          install -d -m 700 "$RUNNER_TEMP/shizhi-ssh"
          trap 'rm -f "$RUNNER_TEMP/shizhi-ssh/key"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/shizhi-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/shizhi-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/shizhi-ssh/key"
          python3 -c 'import json,os,sys,shutil; header={"image":os.environ["IMAGE"],"imageId":os.environ["IMAGE_ID"],"archiveSha256":os.environ["ARCHIVE_SHA256"],"archiveBytes":int(os.environ["ARCHIVE_BYTES"])}; sys.stdout.buffer.write((json.dumps(header)+"\n").encode()); sys.stdout.buffer.flush(); shutil.copyfileobj(open(os.environ["IMAGE_ARCHIVE"],"rb"),sys.stdout.buffer)' |
            ssh -i "$RUNNER_TEMP/shizhi-ssh/key" -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=6 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/shizhi-ssh/known_hosts" "$DEPLOY_HOST" deploy
      - name: Check the public knowledge reader
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://shizhi.omnibbfb.top/healthz)" = ok
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output "$RUNNER_TEMP/shizhi-catalog.json" https://shizhi.omnibbfb.top/api/videos
          python3 -c 'import json,os; c=json.load(open(os.environ["RUNNER_TEMP"]+"/shizhi-catalog.json")); assert isinstance(c,list) and len(c)>0'
