server {
    listen 80;
    server_name kb.omnibbfb.top;
    return 308 https://kb.omnibbfb.top$request_uri;
}

server {
    listen 443 ssl;
    server_name kb.omnibbfb.top;
    ssl_certificate /etc/letsencrypt/live/omnibbfb.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnibbfb.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 1k;
    client_header_timeout 10s;

    location / {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $kb_backend shizhi:8765;
        proxy_pass http://$kb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # PDF.js requests byte ranges; pass these through without caching.
        proxy_buffering off;
    }
}
