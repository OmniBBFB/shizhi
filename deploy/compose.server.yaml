# Merge this services.shizhi entry into ~/docker/main/docker-compose.yml.
# Image selection comes from ~/docker/main/.env; uploads use shizhi/.env.
services:
  shizhi:
    image: ${SHIZHI_IMAGE:-shizhi:20261029-pdf-fonts}
    container_name: shizhi
    restart: unless-stopped
    volumes:
      - ./shizhi/data:/data
    env_file: ./shizhi/.env
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [nginx_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
