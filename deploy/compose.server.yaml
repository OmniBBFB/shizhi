# Run from ~/docker/main alongside the existing docker-compose.yml.
services:
  shizhi:
    image: ${SHIZHI_IMAGE:-shizhi:local}
    container_name: shizhi
    restart: unless-stopped
    volumes:
      - ./shizhi/data:/data
    environment:
      SHIZHI_UPLOAD_TOKEN: ${SHIZHI_UPLOAD_TOKEN:-}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [nginx_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
